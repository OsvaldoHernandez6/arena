<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Benchmark Cosycat · Arena para gatos Chile</title>
<style>
:root{
  --bg:#f6f1ea;--surface:#fffaf5;--ink:#251a17;--muted:#6e5a54;--line:rgba(37,26,23,.10);
  --accent:#b74f2a;--accent-soft:rgba(183,79,42,.08);--gold:#d59b31;--gold-soft:rgba(213,155,49,.12);
  --green:#1D9E75;--green-soft:rgba(29,158,117,.10);--purple:#534AB7;--purple-soft:rgba(83,74,183,.08);
  --teal:#0F6E56;--teal-soft:rgba(15,110,86,.08);
  --shadow-sm:0 2px 8px rgba(76,43,31,.06);--shadow:0 8px 30px rgba(76,43,31,.08);
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fcf7f1 0%,#f4eee7 100%);-webkit-font-smoothing:antialiased}
.page{width:min(1200px,calc(100% - 32px));margin:0 auto;padding:20px 0 72px}
h1{font-size:clamp(30px,4.5vw,52px);line-height:1.02;letter-spacing:-.04em;margin-top:14px}
h2{font-size:clamp(22px,3vw,34px);line-height:1.05;letter-spacing:-.03em}
h3{font-size:18px;letter-spacing:-.02em}
a{color:inherit}
/* nav */
.nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:18px;padding:10px 14px;border-radius:var(--r-md);background:rgba(255,250,245,.92);border:1px solid var(--line);backdrop-filter:blur(16px);position:sticky;top:8px;z-index:100}
.nav a{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;transition:all .2s}
.nav a:hover{color:var(--accent);background:var(--accent-soft)}
.nav a.nav-ig{color:#E4405F}.nav a.nav-ig:hover{background:rgba(228,64,95,.08)}
.nav a.nav-meta{color:#0081FB}.nav a.nav-meta:hover{background:rgba(0,129,251,.08)}
.nav a.nav-diag{color:#fff;background:linear-gradient(135deg,#0D2B5E,#b74f2a)}
.nav-sep{width:1px;height:20px;background:var(--line);margin:0 6px;align-self:center}
.nav-icon{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px}.nav-icon svg{width:14px;height:14px;display:block}
/* layout */
.card{padding:24px;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--shadow-sm)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.section{margin-top:24px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}
.section-head p{max-width:560px;color:var(--muted);font-size:14px;line-height:1.5}
.kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
/* hero */
.hero{padding:30px 32px;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--shadow);margin-bottom:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(224,122,46,.16),transparent 70%)}
.hero-sub{color:var(--muted);font-size:15px;line-height:1.55;max-width:760px;margin-top:12px}
.pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pill.green{color:var(--green);background:var(--green-soft)}.pill.accent{color:var(--accent);background:var(--accent-soft)}.pill.gold{color:#855a0f;background:var(--gold-soft)}.pill.purple{color:var(--purple);background:var(--purple-soft)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px;position:relative;z-index:1}
.metric{padding:16px;border-radius:var(--r-md);background:rgba(37,26,23,.03)}
.metric-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.metric-value{font-size:26px;font-weight:700;letter-spacing:-.04em}
.metric-foot{font-size:11px;color:var(--muted);margin-top:4px}
.scope-note{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.5;position:relative;z-index:1}
/* dividers */
.section-divider{margin:40px 0 22px;padding:20px 24px;border-radius:var(--r-xl);display:flex;align-items:center;gap:14px}
.section-divider.ig{background:linear-gradient(135deg,rgba(228,64,95,.06),rgba(252,175,69,.06));border:1px solid rgba(228,64,95,.15)}
.section-divider.meta{background:rgba(0,129,251,.04);border:1px solid rgba(0,129,251,.12)}
.section-divider.industry{background:rgba(37,26,23,.03);border:1px solid var(--line)}
.section-divider.diag{background:linear-gradient(135deg,#0D2B5E,#b74f2a);color:#fff;border:none;box-shadow:var(--shadow)}
.section-divider.diag p{color:rgba(255,255,255,.75)}
.section-divider-icon{width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.section-divider-icon.ig{background:rgba(228,64,95,.1)}.section-divider-icon.meta{background:rgba(0,129,251,.1)}.section-divider-icon.industry{background:rgba(37,26,23,.06)}.section-divider-icon.diag{background:rgba(255,255,255,.14)}
.section-divider-icon svg{width:22px;height:22px}
.section-divider h2{font-size:clamp(20px,2.5vw,28px)}
.section-divider p{color:var(--muted);font-size:13px;margin-top:3px}
/* insights & recs */
.insight{border-left:3px solid var(--green);padding:10px 0 10px 14px;margin-bottom:10px}
.insight:last-child{margin-bottom:0}
.insight h4{font-size:14px;font-weight:700;margin-bottom:4px}
.insight p{font-size:13px;color:var(--muted);line-height:1.55}
.insight.ig{border-color:#E4405F}.insight.meta{border-color:#0081FB}
.rec-item{padding:12px 0;border-bottom:1px solid var(--line)}
.rec-item:last-child{border-bottom:none}
.rec-item-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rec-item h4{font-size:14px;flex:1}
.rec-item p{font-size:13px;color:var(--muted);line-height:1.55}
/* ranking */
.rank-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rank-row:last-of-type{border-bottom:none}
.rank-pos{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:rgba(37,26,23,.06);color:var(--muted);flex-shrink:0}
.rank-pos.gold{background:#FFF4D6;color:#9A7100}.rank-pos.silver{background:#F0EEF0;color:#6B6B6B}.rank-pos.bronze{background:#FBEEE4;color:#8B5E3C}
.rank-info{flex:1;min-width:0}
.rank-name{font-weight:700;font-size:14px}
.rank-handle{font-size:12px;color:var(--muted);text-decoration:none}
.rank-bar-wrap{width:30%;height:8px;background:rgba(37,26,23,.05);border-radius:99px;overflow:hidden}
.rank-bar{height:100%;border-radius:99px}
.rank-count{font-size:15px;font-weight:700;min-width:70px;text-align:right}
/* table */
.cmp-scroll{overflow-x:auto}
.cmp-table{width:100%;border-collapse:collapse;font-size:13px}
.cmp-table th{text-align:left;font-weight:700;padding:8px 12px;border-bottom:2px solid var(--line);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.cmp-table td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
.cmp-table tr:last-child td{border-bottom:none}
.cmp-table td.num{font-weight:700;white-space:nowrap}
.cmp-table .read{color:var(--muted);min-width:260px}
/* logos */
.logo-tile{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:-.02em;flex-shrink:0}
.logo-tile.sm{width:30px;height:30px;border-radius:8px;font-size:10px}
.brand-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
/* badges */
.badge{font-size:10px;padding:1px 7px;border-radius:10px;margin-left:6px;font-weight:600;white-space:nowrap;vertical-align:1px}
.badge.v{background:#d1e7dd;color:#155724}.badge.e{background:#fff3cd;color:#856404}.badge.c{background:#dbe8fb;color:#1d4f91}
/* brand cards */
.bcard{padding:22px;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--shadow-sm);position:relative}
.bcard.client{border:2px solid #E07A2E;box-shadow:0 10px 30px rgba(224,122,46,.14)}
.bcard-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bcard-top h3{font-size:18px}
.bcard-top a{font-size:12px;color:var(--muted);text-decoration:none}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:12px}
.status i{width:7px;height:7px;border-radius:50%;display:inline-block}
.status.on{background:var(--green-soft);color:var(--green)}.status.on i{background:#00C853;box-shadow:0 0 6px rgba(0,200,83,.5)}
.status.off{background:rgba(37,26,23,.05);color:#9b8a84}.status.off i{background:#c9bdb8}
.status.warn{background:var(--gold-soft);color:#855a0f}.status.warn i{background:var(--gold)}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-of-type{border-bottom:none}
.kv span{color:var(--muted)}
.kv b{font-size:15px;letter-spacing:-.02em}
.freq{margin-top:14px}
.freq-label{font-size:11px;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
.freq-track{background:rgba(37,26,23,.06);height:10px;border-radius:5px;overflow:hidden}
.fmt{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:6px}
.fmt div{height:100%}
.fmt-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin-top:6px}
.bio{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.client-tag{position:absolute;top:-11px;right:18px;background:#E07A2E;color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
/* stats & opps */
.stat{padding:18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.stat-value{font-size:32px;font-weight:800;letter-spacing:-.04em;color:var(--accent)}
.stat-label{font-size:13px;line-height:1.45;margin-top:4px}
.stat-src{font-size:11px;color:var(--muted);margin-top:8px}
.opp{padding:22px;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.opp-icon{font-size:26px;margin-bottom:10px}
.opp h3{margin-bottom:8px}
.opp p{font-size:13px;color:var(--muted);line-height:1.55}
.opp-hook{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft);font-size:13px;line-height:1.5;color:#7a3519}
.opp-hook b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:12px}
.tag{font-size:11px;padding:2px 9px;border-radius:999px;background:rgba(37,26,23,.05);color:var(--muted);font-weight:600}
/* meta ads */
.mab{padding:22px;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--shadow-sm)}
.mab.has{border-color:rgba(0,129,251,.25)}
.mab.no{opacity:.88}
.ma-status{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700}
.ma-status.active{color:#0081FB;background:rgba(0,129,251,.08)}
.ma-status.inactive{color:#9b8a84;background:rgba(37,26,23,.04)}
.ma-status i{width:8px;height:8px;border-radius:50%}
.ma-status.active i{background:#00C853;box-shadow:0 0 6px rgba(0,200,83,.4)}
.ma-status.inactive i{background:#ccc}
.ma-count{font-size:44px;font-weight:800;letter-spacing:-.05em;color:#0081FB;line-height:1;margin:14px 0 4px}
.mab.no .ma-count{color:#c9bdb8}
.ma-notes{margin-top:12px;padding:0;list-style:none}
.ma-notes li{position:relative;padding:8px 0 8px 16px;font-size:13px;line-height:1.5;color:var(--muted);border-bottom:1px solid var(--line)}
.ma-notes li:last-child{border-bottom:none}
.ma-notes li::before{content:"";position:absolute;left:0;top:15px;width:6px;height:6px;border-radius:50%;background:#0081FB}
.mab.no .ma-notes li::before{background:#ccc}
.ma-btn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:10px 18px;border-radius:var(--r-sm);background:#0081FB;color:#fff;text-decoration:none;font-size:13px;font-weight:600}
.ma-btn:hover{background:#006ad4}
.theme-row{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:8px}
.theme-row span{flex:1}
.theme-row .t-track{width:45%;height:8px;background:rgba(0,129,251,.08);border-radius:99px;overflow:hidden}
.theme-row .t-bar{height:100%;background:#0081FB;border-radius:99px}
.eco{margin-top:14px;padding:14px;border-radius:var(--r-md);background:rgba(0,129,251,.05);font-size:13px;line-height:1.5;color:#1a4a80}
/* embeds */
.embed-shell{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#fff}
.embed-shell iframe{width:100%;border:none;min-height:560px;display:block}
.post-meta{padding:14px 2px 0}
.post-meta .pm-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.post-meta .pm-stats{font-size:13px;font-weight:700;margin-top:6px}
.post-meta p{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px}
/* diagnostic */
.score-wrap{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center}
.gauge{position:relative;width:220px;height:220px;margin:0 auto}
.gauge svg{transform:rotate(-90deg)}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-center b{font-size:56px;letter-spacing:-.05em;line-height:1}
.gauge-center span{font-size:13px;color:var(--muted)}
.verdict-label{font-size:clamp(20px,2.4vw,26px);font-weight:700;letter-spacing:-.03em;line-height:1.2}
.verdict-desc{font-size:14px;color:var(--muted);line-height:1.6;margin-top:10px}
.mini-scores{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.mini-score{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r-md);background:rgba(37,26,23,.04);font-size:13px}
.mini-score b{font-size:18px}
.list-card h4{font-size:13px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.list-card ul{list-style:none;padding:0}
.list-card li{font-size:13px;line-height:1.5;padding:8px 0 8px 22px;border-bottom:1px solid var(--line);position:relative}
.list-card li:last-child{border-bottom:none}
.list-card.s li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:800}
.list-card.w li::before{content:"✕";position:absolute;left:0;color:var(--accent);font-weight:800}
.list-card.p li{counter-increment:pr}
.list-card.p ul{counter-reset:pr}
.list-card.p li::before{content:counter(pr);position:absolute;left:0;top:8px;width:16px;height:16px;border-radius:50%;background:#0D2B5E;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sev{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.sev.alta{background:var(--accent-soft);color:var(--accent)}.sev.media{background:var(--gold-soft);color:#855a0f}
.rub-bar{height:8px;border-radius:99px;background:rgba(37,26,23,.06);overflow:hidden;min-width:80px}
.rub-bar div{height:100%;border-radius:99px}
.chart-box{position:relative;height:260px}
.footnote{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
footer{margin-top:40px;padding:24px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}
footer a{color:var(--muted)}
footer ol{padding-left:18px;margin-top:6px}
@media (max-width:900px){.score-wrap{grid-template-columns:1fr}}
@media (max-width:768px){.g2,.g3,.g4{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.rank-bar-wrap{width:25%}.hero{padding:22px}}
@media (max-width:480px){.metrics{grid-template-columns:1fr}.rank-bar-wrap{display:none}}
</style>
</head>
<body>
<div class="page">
  <nav class="nav" id="nav"></nav>
  <div id="app"></div>
  <footer id="footer"></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
let DATA={};
const IG_SVG='<svg viewBox="0 0 24 24" fill="#E4405F"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 3.9 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7 1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 100 12.4 6.2 6.2 0 000-12.4zM12 16a4 4 0 110-8 4 4 0 010 8zm6.4-11.8a1.4 1.4 0 100 2.9 1.4 1.4 0 000-2.9z"/></svg>';
const META_SVG='<svg viewBox="0 0 24 24" fill="#0081FB"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.5h-2.8V24C19.62 23.1 24 18.1 24 12.07"/></svg>';

const fmtN=n=>n.toLocaleString('es-CL');
const B=id=>DATA.brands.find(b=>b.id===id);
const badge=c=>c==='verified'?'<span class="badge v">verificado ✓</span>':c==='calculated'?'<span class="badge c">calculado</span>':'<span class="badge e">estimado</span>';
const logo=(b,sm)=>`<div class="logo-tile${sm?' sm':''}" style="background:${b.color}">${b.abbr}</div>`;
const CL=()=>B(DATA.meta.client);
const ORDER=()=>DATA.diagnosticBrand.order;
const dc=n=>n.toString().replace('.',',');
const sevPill=s=>`<span class="sev ${s}">${s}</span>`;
const prio=p=>`<span class="pill ${p==='alta'?'accent':'gold'}">${p}</span>`;
const insights=(arr,cls)=>arr.map(c=>`<div class="insight ${cls||''}"><h4>${c.title}</h4><p>${c.text}</p></div>`).join('');
const recs=arr=>arr.map(r=>`<div class="rec-item"><div class="rec-item-top"><h4>${r.title}</h4>${prio(r.priority)}</div><p>${r.text}</p></div>`).join('');
function divider(cls,icon,title,sub,id){return `<div class="section-divider ${cls}" id="${id}"><div class="section-divider-icon ${cls}">${icon}</div><div><h2>${title}</h2><p>${sub}</p></div></div>`}

function renderNav(){
  document.getElementById('nav').innerHTML=`
    <a href="#top">Resumen</a><a href="#industria">Industria</a><a href="#oportunidades">Oportunidades</a>
    <span class="nav-sep"></span>
    <a class="nav-ig" href="#instagram"><span class="nav-icon">${IG_SVG}</span>Instagram</a>
    <a class="nav-meta" href="#metaads"><span class="nav-icon">${META_SVG}</span>Meta Ads</a>
    <span class="nav-sep"></span>
    <a class="nav-diag" href="#diagnostico">🔬 Diagnóstico ${CL().name}</a>`;
}

function renderHero(){
  const c=CL(),d=DATA.diagnosticBrand,v=d.verdict,sm=DATA.instagram.sample[c.id];
  const ads=ORDER().map(id=>DATA.metaAds.brands.find(m=>m.brand===id).adsCount).join(' · ');
  return `<header class="hero" id="top">
    <span class="pill accent">Benchmark competitivo · ${DATA.meta.extractionDate}</span>
    <h1>${ORDER().map(id=>B(id).name.replace("'","’")).join(' vs. ')}</h1>
    <p class="hero-sub">Arena sanitaria para gatos en Chile, desde la perspectiva de <b>${c.name}</b>. La categoría digital es una carrera de dos marcas: Cosycat y Catit. Cosycat tiene el mejor formato, el mejor embudo de venta y los reels de creators con más respuesta del set, pero su contenido propio casi no genera conversación.</p>
    <div class="metrics">
      <div class="metric"><div class="metric-label">Seguidores ${c.name}</div><div class="metric-value">${fmtN(c.followers)}</div><div class="metric-foot">${Math.round(c.followers/B('catit').followers*100)}% de Catit · #2 de la categoría</div></div>
      <div class="metric"><div class="metric-label">Anuncios activos en Meta</div><div class="metric-value">${ads}</div><div class="metric-foot">${ORDER().map(id=>B(id).name).join(' · ')}</div></div>
      <div class="metric"><div class="metric-label">Rinde una colab vs. un post propio</div><div class="metric-value">${Math.round(sm.collabAvgLikes/sm.avgLikes)}×</div><div class="metric-foot">${fmtN(sm.collabAvgLikes)} vs. ${sm.avgLikes} likes promedio</div></div>
      <div class="metric"><div class="metric-label">Puntaje diagnóstico ${c.name}</div><div class="metric-value">${v.scoreLabel}</div><div class="metric-foot">${Object.entries(v.competitorScores).map(([k,x])=>B(k).name+' '+x).join(' · ')}</div></div>
    </div>
    <p class="scope-note"><b>Alcance:</b> ${DATA.meta.scope}<br><b>Método:</b> ${DATA.meta.method}</p>
  </header>`;
}

function renderIndustry(){
  const so=DATA.strategicOpportunities;
  const ranked=[...DATA.brands].sort((a,b)=>b.followers-a.followers);
  const max=ranked[0].followers;
  return divider('industry','📊','Sobre la industria','Contexto del mercado y posición de cada marca','industria')+`
  <div class="grid g3">${so.industryStats.map(s=>`<div class="stat"><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div><div class="stat-src">Fuente: ${s.source}</div></div>`).join('')}</div>
  <div class="grid g2 section">
    <div class="card"><div class="kicker">Ranking de audiencia · Instagram</div>
      ${ranked.map((b,i)=>`<div class="rank-row"><div class="rank-pos ${['gold','silver','bronze'][i]}">${i+1}</div>${logo(b,true)}
      <div class="rank-info"><div class="rank-name">${b.name}${b.role==='cliente'?' <span class="pill accent" style="font-size:9px;padding:2px 7px">cliente</span>':''}</div><a class="rank-handle" href="${b.url}" target="_blank">${b.handle}</a></div>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${Math.max(2,b.followers/max*100)}%;background:${b.color}"></div></div>
      <div class="rank-count">${fmtN(b.followers)}${badge('verified')}</div></div>`).join('')}
    </div>
    <div class="card"><div class="kicker">Estado de cada marca</div>
      ${DATA.brands.map(b=>{const cls=b.id==='catsbest'?'off':b.id==='ecobed'?'warn':'on';return `<div class="rank-row">${logo(b,true)}<div class="rank-info"><div class="rank-name">${b.name}</div><div class="rank-handle">Último post: ${b.lastPost}</div></div><span class="status ${cls}" style="margin:0"><i></i>${b.status}</span></div>`}).join('')}
      <p class="footnote">De 4 marcas, solo 2 compiten de verdad en digital. Cat’s Best abandonó Instagram hace casi 6 años y Ecobed publica sin respuesta. La pelea por la atención, orgánica y pagada, es entre Cosycat y Catit.</p>
    </div>
  </div>`;
}

function renderOpportunities(){
  const so=DATA.strategicOpportunities;
  return `<div class="section" id="oportunidades"><div class="section-head"><div><div class="kicker">Estrategia</div><h2>${so.title}</h2></div><p>${so.subtitle}. Cada una nace de una brecha visible en los datos de este benchmark.</p></div>
  <div class="grid g3">${so.opportunities.map(o=>`<div class="opp"><div class="opp-icon">${o.icon}</div><h3>${o.title}</h3><p>${o.description}</p><div class="opp-hook"><b>Idea de contenido</b>${o.hook}</div><div class="tags">${o.platforms.map(p=>`<span class="tag">${p}</span>`).join('')}</div></div>`).join('')}</div></div>`;
}

function renderInstagram(){
  const ig=DATA.instagram, s=ig.sample, di=DATA.diagnosticBrand.instagram;
  return divider('ig',IG_SVG,'Instagram','Audiencia, ritmo, formatos y respuesta de la comunidad','instagram')+`
  <div class="card"><div class="kicker">Comparativa de estrategia</div><div class="cmp-scroll"><table class="cmp-table">
    <thead><tr><th>Marca</th><th>Seguidores</th><th>Posts</th><th>Tono</th><th>Frecuencia</th><th>CTA</th><th>Comunidad</th></tr></thead>
    <tbody>${ig.comparison.map(r=>{const b=B(r.brand);return `<tr><td class="num"><span class="brand-dot" style="background:${b.color}"></span>${b.name}</td><td class="num">${fmtN(b.followers)}</td><td class="num">${fmtN(b.posts)}</td><td>${r.tone}</td><td>${r.frequency}</td><td>${r.cta}</td><td>${r.community}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="grid g2 section">
    <div class="card"><div class="kicker">Engagement mediano por post propio</div><div class="chart-box"><canvas id="chEng"></canvas></div><p class="footnote">(likes + comentarios) ÷ seguidores, mediana de la muestra. La línea punteada marca el 0,5%, el mínimo esperable para cuentas de este tamaño. Cat’s Best aparece con su dato histórico (2020–21), en color tenue.</p></div>
    <div class="card"><div class="kicker">Likes promedio por post: propio vs. colaboración</div><div class="chart-box"><canvas id="chCollab"></canvas></div><p class="footnote">Cosycat: ${s.cosycat.own} propios y ${s.cosycat.collabs} colabs (jun–oct 2026). Catit: ${s.catit.own} propios y ${s.catit.collabs} colabs (feb–oct 2026). Escala logarítmica.</p></div>
  </div>
  <div class="grid g2 section">
    <div class="card"><div class="kicker">Conclusiones</div>${insights(ig.conclusions,'ig')}</div>
    <div class="card"><div class="kicker">Recomendaciones</div>${recs(ig.recommendations)}</div>
  </div>
  <div class="section"><div class="section-head"><div><div class="kicker">Posts destacados</div><h2>Lo que funciona y lo que no</h2></div><p>Embeds en vivo desde Instagram. Si alguno no carga, ábrelo con el enlace.</p></div>
  <div class="grid g3">${ig.topPosts.slice(0,3).map(postCard).join('')}</div>
  <div class="grid g3 section">${ig.topPosts.slice(3).map(postCard).join('')}</div></div>`;
}
function postCard(p){const b=B(p.brand);return `<div><div class="embed-shell"><iframe loading="lazy" src="https://www.instagram.com/p/${p.code}/embed/captioned/"></iframe></div>
  <div class="post-meta"><div class="pm-top"><span class="brand-dot" style="background:${b.color}"></span>${b.name} · ${p.type} · ${p.date}</div>
  <div class="pm-stats">❤ ${fmtN(p.likes)} · 💬 ${fmtN(p.comments)}</div><p>${p.note} <a href="https://www.instagram.com/p/${p.code}/" target="_blank">Ver post ↗</a></p></div></div>`}

function renderMeta(){
  const ma=DATA.metaAds;
  return divider('meta',META_SVG,'Meta Ads','Biblioteca de anuncios de Meta · Chile · anuncios activos al '+DATA.meta.extractionDate,'metaads')+`
  <div class="grid g2">${ma.brands.map(m=>{const b=B(m.brand);const maxT=m.themes?Math.max(...m.themes.map(t=>t.count)):1;return `<div class="mab ${m.active?'has':'no'}">
    <div class="bcard-top" style="margin-bottom:10px">${logo(b)}<div><h3>${b.name}${b.role==='cliente'?' <span class="pill accent" style="font-size:9px;padding:2px 7px">cliente</span>':''}</h3><a href="${b.url}" target="_blank">${b.handle}</a></div></div>
    <span class="ma-status ${m.active?'active':'inactive'}"><i></i>${m.active?'Con anuncios activos':'Sin anuncios propios'}</span>
    <div class="ma-count">${m.adsCount}</div><div style="font-size:12px;color:var(--muted)">anuncios activos ${badge('verified')}</div>
    <p style="font-size:13px;line-height:1.5;margin-top:12px">${m.summary}</p>
    ${m.themes?`<div style="margin-top:12px">${m.themes.map(t=>`<div class="theme-row"><span>${t.name}</span><div class="t-track"><div class="t-bar" style="width:${t.count/maxT*100}%"></div></div><b>${t.count}</b></div>`).join('')}</div>`:''}
    <ul class="ma-notes">${m.notes.map(n=>`<li>${n}</li>`).join('')}</ul>
    ${m.ecosystem?`<div class="eco">${m.ecosystem}</div>`:''}
    ${m.libraryUrl?`<a class="ma-btn" href="${m.libraryUrl}" target="_blank">Ver en la Biblioteca de anuncios ↗</a>`:''}
  </div>`}).join('')}</div>
  <div class="grid g2 section">
    <div class="card"><div class="kicker">Conclusiones</div>${insights(ma.conclusions,'meta')}</div>
    <div class="card"><div class="kicker">Recomendaciones</div>${recs(ma.recommendations)}</div>
  </div>`;
}

function brandCard(b,ig){
  const fmtColors=['#E4405F','#FCAF45','#534AB7','#1D9E75'];
  const st=b.id==='catsbest'?'off':b.id==='ecobed'?'warn':'on';
  const freqTxt=ig.postsPerWeekWithCollabs?`${dc(ig.postsPerWeek)} propios · ${dc(ig.postsPerWeekWithCollabs)} con colabs`:dc(ig.postsPerWeek);
  const er=ig.engagementRateHistoric?`— <span style="font-size:11px;color:var(--muted)">(hist. ${ig.engagementRateHistoric}%)</span>`:`${ig.engagementRate.toString().replace('.',',')}%`;
  return `<div class="bcard ${b.role==='cliente'?'client':''}">${b.role==='cliente'?'<span class="client-tag">Marca cliente</span>':''}
    <div class="bcard-top">${logo(b)}<div><h3>${b.name}</h3><a href="${b.url}" target="_blank">${ig.handle} ↗</a></div></div>
    <span class="status ${st}"><i></i>${b.status}</span>
    <div class="kv"><span>Seguidores ${badge(b.confidence.followers)}</span><b>${fmtN(ig.followers)}</b></div>
    <div class="kv"><span>Publicaciones ${badge(b.confidence.posts)}</span><b>${fmtN(ig.posts)}</b></div>
    <div class="kv"><span>Engagement mediano ${badge(b.confidence.engagement)}</span><b>${er}</b></div>
    <div class="freq"><div class="freq-label"><span>Posts por semana ${badge(b.confidence.frequency)}</span><b style="color:var(--ink)">${freqTxt}</b></div>
      <div class="freq-track"><div style="background:${b.color};width:${Math.max(1.5,Math.min(100,ig.postsPerWeek/4.5*100))}%;height:10px;border-radius:5px"></div></div></div>
    <div class="freq"><div class="freq-label"><span>Mix de formatos (feed propio)</span></div>
      <div class="fmt">${ig.formats.map((f,i)=>`<div style="width:${f.pct}%;background:${fmtColors[i]}"></div>`).join('')}</div>
      <div class="fmt-legend">${ig.formats.map((f,i)=>`<span><span class="brand-dot" style="background:${fmtColors[i]};width:7px;height:7px"></span>${f.type} ${f.pct}%</span>`).join('')}</div></div>
    <div class="bio">“${b.bio}”</div>
  </div>`;
}

function renderDiagnostic(){
  const d=DATA.diagnosticBrand, v=d.verdict;
  const C=2*Math.PI*92, off=C*(1-v.scoreValue/100);
  const ids=ORDER();
  return divider('diag','🔬','Diagnóstico '+CL().name,'Análisis interno vs. competencia · Instagram + Meta Ads','diagnostico')+`
  <div class="grid g2">${ids.map(id=>brandCard(B(id),d.instagram[id])).join('')}</div>

  <div class="card section"><div class="score-wrap">
    <div class="gauge"><svg width="220" height="220" viewBox="0 0 220 220"><circle cx="110" cy="110" r="92" fill="none" stroke="rgba(37,26,23,.07)" stroke-width="18"/>
      <circle cx="110" cy="110" r="92" fill="none" stroke="url(#gg)" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
      <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#0D2B5E"/><stop offset="1" stop-color="#E07A2E"/></linearGradient></defs></svg>
      <div class="gauge-center"><b>${v.scoreValue}</b><span>de 100</span></div></div>
    <div><div class="kicker">Veredicto</div><div class="verdict-label">${v.label}</div><p class="verdict-desc">${v.description}</p>
      <div class="mini-scores">${ids.map(id=>{const b=B(id);const sc=id===d.client?v.scoreValue:v.competitorScores[id];return `<div class="mini-score"><span class="brand-dot" style="background:${b.color}"></span>${b.name} <b>${sc}</b></div>`}).join('')}</div>
      <p class="footnote">${d.scoreNote}</p></div>
  </div></div>

  <div class="grid g3 section">
    <div class="card list-card s"><h4 style="color:var(--green)">Fortalezas</h4><ul>${v.strengths.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="card list-card w"><h4 style="color:var(--accent)">Debilidades</h4><ul>${v.weaknesses.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="card list-card p"><h4 style="color:#0D2B5E">Prioridades</h4><ul>${v.priority.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  </div>

  <div class="card section"><div class="kicker">Puntaje por dimensión</div><div class="cmp-scroll"><table class="cmp-table">
    <thead><tr><th>Dimensión</th><th>Peso</th>${ids.map(id=>`<th>${B(id).name}</th>`).join('')}</tr></thead>
    <tbody>${d.rubric.map(r=>`<tr><td><b>${r.dimension}</b></td><td class="num">${r.weight}</td>${ids.map(id=>`<td><div style="display:flex;align-items:center;gap:8px"><div class="rub-bar" style="flex:1"><div style="width:${r[id]/r.weight*100}%;background:${B(id).color}"></div></div><b style="min-width:36px">${r[id]}/${r.weight}</b></div></td>`).join('')}</tr>`).join('')}
    <tr><td><b>Total</b></td><td class="num">100</td>${ids.map(id=>`<td class="num" style="font-size:16px">${d.rubric.reduce((a,r)=>a+r[id],0)}</td>`).join('')}</tr></tbody></table></div></div>

  <div class="card section"><div class="kicker">Tabla de brechas</div><div class="cmp-scroll"><table class="cmp-table">
    <thead><tr><th>Dimensión</th>${ids.map(id=>`<th><span class="brand-dot" style="background:${B(id).color}"></span>${B(id).name}</th>`).join('')}<th>Lectura estratégica</th><th>Criticidad</th></tr></thead>
    <tbody>${d.gaps.map(g=>`<tr><td><b>${g.dimension}</b></td>${ids.map(id=>`<td class="num">${g[id]}</td>`).join('')}<td class="read">${g.gapText}</td><td>${sevPill(g.severity)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

function renderFooter(){
  document.getElementById('footer').innerHTML=`<b>Fuentes</b><ol>${DATA.sources.map(s=>`<li><a href="${s.url}" target="_blank">${s.title}</a></li>`).join('')}</ol>
  <p style="margin-top:10px">Datos de Instagram y Meta Ads extraídos el ${DATA.meta.extractionDate}. <span class="badge v">verificado ✓</span> = leído directamente en la plataforma. <span class="badge c">calculado</span> = derivado de datos verificados de la muestra.</p>`;
}

function renderCharts(){
  Chart.defaults.font.family='"Avenir Next","Segoe UI",system-ui,sans-serif';
  Chart.defaults.color='#6e5a54';
  const ids=ORDER(), di=DATA.diagnosticBrand.instagram;
  const vals=ids.map(id=>di[id].engagementRateHistoric||di[id].engagementRate);
  const labels=ids.map(id=>B(id).name+(di[id].engagementRateHistoric?' · inactiva (2020–21)':''));
  const refLine={id:'ref',afterDatasetsDraw(c){const x=c.scales.x.getPixelForValue(0.5),{top,bottom}=c.chartArea,ctx=c.ctx;ctx.save();ctx.setLineDash([5,4]);ctx.strokeStyle='#b74f2a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();ctx.fillStyle='#b74f2a';ctx.font='600 11px system-ui';ctx.fillText('0,5% referencia',x+6,top+12);ctx.restore()}};
  new Chart(document.getElementById('chEng'),{type:'bar',data:{labels,datasets:[{data:vals,
    backgroundColor:ids.map(id=>di[id].engagementRateHistoric?B(id).colorSoft:B(id).color),borderColor:ids.map(id=>B(id).color),borderWidth:ids.map(id=>di[id].engagementRateHistoric?1.5:0),borderRadius:6,barThickness:26}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>dc(c.raw)+'%'}}},scales:{x:{min:0,max:1,ticks:{callback:v=>dc(v)+'%'},grid:{color:'rgba(37,26,23,.06)'}},y:{grid:{display:false}}}},plugins:[refLine]});
  const S=DATA.instagram.sample, two=['cosycat','catit'];
  new Chart(document.getElementById('chCollab'),{type:'bar',data:{labels:two.map(id=>B(id).name),datasets:[
    {label:'Post propio',data:two.map(id=>S[id].avgLikes),backgroundColor:two.map(id=>B(id).colorSoft),borderColor:two.map(id=>B(id).color),borderWidth:1.5,borderRadius:6},
    {label:'Colaboración con creator',data:two.map(id=>S[id].collabAvgLikes),backgroundColor:two.map(id=>B(id).color),borderRadius:6}]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:8}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmtN(c.raw)+' likes'}}},
      scales:{y:{type:'logarithmic',min:10,max:3000,ticks:{callback:v=>[10,30,100,300,1000,3000].includes(v)?fmtN(v):''},grid:{color:'rgba(37,26,23,.06)'}},x:{grid:{display:false}}}}});
}

function render(){
  renderNav();
  document.getElementById('app').innerHTML=renderHero()+renderIndustry()+renderOpportunities()+renderInstagram()+renderMeta()+renderDiagnostic();
  renderFooter();
}
async function init(){
  const r=await fetch('data.json',{cache:'no-store'});DATA=await r.json();render();
  setTimeout(renderCharts,100);
}
init();
</script>
</body>
</html>
